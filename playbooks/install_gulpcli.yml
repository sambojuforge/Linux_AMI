---

# This playbook has Node JS installation dependency

- name: 'NPM gulp-cli installtion playbook'
  hosts: default
  vars: 
    ansible_python_interpreter: "/usr/bin/python2.7"

  tasks:
    - name: Installing gulp-cli NPM packages
      npm: 
        name: gulp-cli
        global: yes
        state: present
      become: true
