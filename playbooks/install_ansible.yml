---
- name: 'Ansible 2.9.14 playbook'
  hosts: default
  vars: 
    ansible_python_interpreter: "/usr/bin/python2.7"

  tasks:
    - name: Installing python pip
      yum:
        name: python2-pip-9.0.3-1.amzn2.0.2.noarch
        state: present
        update_cache: yes
      become: true

    - name: Installing Ansible 2.9.14 version
      pip: 
        name: ansible==2.9.14
        state: present
      become: true 
    